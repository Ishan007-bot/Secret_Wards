# Clarity privacy policy. Flat "key: value" lines (read by rakshak/policy.py, no PyYAML needed).

# --- dates ---------------------------------------------------------------
date_shift_min_days: 7       # |shift| is at least this (never 0)
date_shift_max_days: 180     # |shift| is at most this; one secret shift per patient
dob_jitter_min_days: 30      # DOB gets its own per-patient jitter
dob_jitter_max_days: 365
dob_mode: remove             # remove | jitter. Measured: a jittered DOB keeps the birth year (+-1), which the
                             # registry attacker uses to single people out; removing it costs <0.2 utility pts

# --- age -------------------------------------------------------------------
age_band_years: 10           # bands always contain the true age
age_top_code: 85             # ages >= this become "85+"

# --- location ----------------------------------------------------------------
location_level: district     # village / mohalla / tehsil -> district
pin_prefix_digits: 3         # 229073 -> 229***

# --- rare values / k-anonymity ----------------------------------------------
k_anonymity: 3               # patients in a (gender, age band, district) cell smaller than this...
age_band_wide_years: 20      # ...get this wider (still truthful) age band in all their records
rare_diagnosis_k: 2          # diagnoses held by a single patient -> ICD-10 chapter (k=3 measured: 2.3% medical loss)

# --- ingestion safety ------------------------------------------------------
max_json_depth: 200          # deeper JSON is quarantined
